[package]
name = "youtube-playlist-player"
version = "0.6.0-alpha"
edition = "2021"
repository = "https://github.com/r-reyrou-public/youtube-playlist-player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
yup-oauth2 = "12"
webbrowser = "1"
rand = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
